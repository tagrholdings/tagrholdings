name: Task reminders

# MANUAL BACKUP ONLY — the reminder sweep's real scheduler is cron-job.org (since 2026-10-15), which POSTs to
# https://crm.tagrholdings.com/api/cron/task-reminders every 20 minutes with `Authorization: Bearer <CRON_SECRET>`.
#
# Why not GitHub's schedule: it is best-effort and, for this repo, ran every 2–9 hours instead of every 5 minutes
# (median 5h), so reminders arrived hours late and the L10 heads-up rarely went out at all.
# Why every 20 minutes, not every minute: each sweep queries Postgres, and Neon only suspends the compute after
# 5 idle minutes — a sweep every ≤5 min keeps it on 24/7 (~183 CU-hours/month), past the Free plan's 100, which
# suspends the database until the next month. Every 20 min is ~45 CU-hours/month. Reminders can be up to 20 min late.
#
# Run this by hand ("Run workflow") to send due reminders right now, e.g. if cron-job.org is down. The endpoint is
# idempotent — each reminder is claimed atomically and sent once — so extra runs are harmless.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CRON_SECRET   the same value as the CRM's CRON_SECRET env var (Vercel → Production)
#   APP_URL       the CRM's origin, e.g. https://crm.tagrholdings.com (no trailing slash)

on:
  workflow_dispatch:

concurrency:
  group: task-reminders
  cancel-in-progress: false

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the reminders endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "CRON_SECRET and APP_URL must be set as repository secrets." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/task-reminders"
          echo
